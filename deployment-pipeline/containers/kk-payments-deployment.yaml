apiVersion: apps/v1
kind: Deployment
metadata:
  name: kk-payments
  labels:
    app: kk-payments
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kk-payments
  template:
    metadata:
      labels:
        app: kk-payments
    spec:
      imagePullSecrets:
      - name: kijani-registry-credentials
      containers:
      - name: kk-payments
        image: ghcr.io/wangareceline/kk-payments:1.4.0-d9f5edc
        ports:
        - containerPort: 3001
        env:
        - name: PORT
          value: "3001"
        - name: VERSION
          value: "1.4.0-d9f5edc"
        envFrom:
        - configMapRef:
            name: kk-payments-config
        resources:
          requests:
            cpu: "100m"
            memory: "64Mi"
          limits:
            cpu: "250m"
            memory: "128Mi"
