---
service_name: kk-payments
service_user: kk-payments
service_port: 3001
env_file_name: payments-api.env
# This server gets the full hardening set - it's the one graded on
# scoring below 2.5 on systemd-analyze security.
full_hardening: true
# Only kk-payments gets a port-specific ufw rule: monitoring subnet allowed,
# loopback allowed for nginx's internal proxy, then explicit deny for everyone else.
needs_external_rule: true
needs_exec_reload: false
