---
- name: restart service
  systemd:
    name: "{{ service_name }}"
    state: restarted

- name: reload systemd and restart service
  systemd:
    daemon_reload: true
    name: "{{ service_name }}"
    state: restarted

- name: restart journald
  systemd:
    name: systemd-journald
    state: restarted
