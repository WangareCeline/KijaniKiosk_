---
# Phase 2: Service accounts
- name: Create shared kijanikiosk group
  group:
    name: "{{ kijanikiosk_group }}"
    state: present

- name: Create service system user
  user:
    name: "{{ service_user }}"
    group: "{{ kijanikiosk_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false
    state: present
