apiVersion: v1
kind: Service
metadata:
  name: kk-api
  namespace: kijani-project
spec:
  type: ClusterIP
  selector:
    app: kk-api
  ports:
    # port 8080 is what the Ingress and other services use to reach kk-api.
    # targetPort 80 is the port nginx actually listens on inside the container.
    - port: 8080
      targetPort: 80
